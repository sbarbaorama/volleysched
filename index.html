/* posizioni di gioco dopo il servizio: avanti B4 C3 P/O2, dietro P/O1 B6 C5 */
function playZone(slot, front){ const r=SLOT_ROLE[slot]; if(front) return r==='B'?4:r==='C'?3:2; return r==='B'?6:r==='C'?5:1; }
function courtSVG(f, k, mode, opt={}){
  const z=rotAt(k), who=opt.who||(s=>f[s]), W=300, H=opt.serve?330:300;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="20" width="270" height="270" fill="#f4d3a1" stroke="#fff" stroke-width="3"/><rect x="15" y="20" width="270" height="90" fill="#efc387"/>
    <line x1="15" y1="110" x2="285" y2="110" stroke="#fff" stroke-width="2.5"/><line x1="5" y1="20" x2="295" y2="20" stroke="#1f2a44" stroke-width="5"/><text x="150" y="13" text-anchor="middle" font-size="10" fill="#666">rete</text>`;
  const pts=[];
  z.forEach((slot,i)=>{ const zone=i+1, front=[2,3,4].includes(zone);
    let pos=ZXY[zone];
    if(mode==='gioco') pos=ZXY[playZone(slot,front)];
    let sl=slot;
    if(f.libero && f.L && SLOT_ROLE[slot]==='C' && !front && !(zone===1 && opt.serve)) sl='L';
    pts.push({slot:sl, zone, front, pos}); });
  if(mode==='partenza'){   // il palleggiatore va a rete per alzare
    const p=pts.find(x=>x.slot==='P');
    if(p && !(p.zone===2||p.zone===3)) s+=`<path d="M${p.pos[0]} ${p.pos[1]} L 200 44" stroke="#1e9e5a" stroke-width="3" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>`;
    s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e9e5a"/></marker></defs>`;
  }
  for(const p of pts){
    let [x,y]=p.pos; if(opt.serve && p.zone===1 && mode==='partenza'){ y=312; }
    const r=SLOT_ROLE[p.slot], id=who(p.slot), sel=opt.sel && id===opt.sel;
    s+=`<g ${opt.click?`data-pick="${esc(id)}" style="cursor:pointer"`:''}><circle cx="${x}" cy="${y}" r="21" fill="${ROLE_COL[r]}" stroke="${sel?'#e07b22':'#fff'}" stroke-width="${sel?5:2.5}"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${esc(id?athNum(id):p.slot)}</text>
      <text x="${x}" y="${y+35}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2a44">${esc(id?athShort(id):'')}</text>${id&&getAt(id)&&sexOf(getAt(id))?`<circle cx="${x+17}" cy="${y-15}" r="8" fill="#fff" stroke="#1f2a44" stroke-width="1"/><text x="${x+17}" y="${y-11.5}" text-anchor="middle" font-size="10" font-weight="800" fill="${isF(getAt(id))?'#c2185b':'#1f4f8f'}">${isF(getAt(id))?'D':'U'}</text>`:''}</g>`;
  }
  if(opt.serve && mode==='partenza') s+=`<text x="285" y="326" text-anchor="end" font-size="10.5" fill="#8a5a00" font-weight="700">batte</text>`;
  return s+'</svg>';
}
function formOptions(m, f, slot){
  const conv=convocati(m), pool=conv.length?conv:db.athletes.filter(a=>a.iscritto);
  const want=SLOT_ROLE[slot], used=new Set(Object.entries(f).filter(([k,v])=>k!==slot && v && SLOTS.concat([['L']]).some(([s])=>s===k)).map(([,v])=>v));
  const fit=pool.filter(a=>roleKey(a.ruolo)===want), fit2=pool.filter(a=>roleKey(a.ruolo)!==want && roleKey(a.ruolo2)===want), other=pool.filter(a=>!fit.includes(a) && !fit2.includes(a));
  const o=a=>`<option value="${a.id}" ${f[slot]===a.id?'selected':''}>${esc((a.numeroMaglia?a.numeroMaglia+' · ':'')+fullName(a))} (${isF(a)?'D':isM(a)?'U':'?'})${used.has(a.id)?' – già in campo':''}</option>`;
  const extra=f[slot] && !pool.some(a=>a.id===f[slot]) && getAt(f[slot]) ? o(getAt(f[slot])) : '';
  return `<option value="">—</option>${extra}${fit.length?`<optgroup label="Ruolo principale">${fit.map(o).join('')}</optgroup>`:''}${fit2.length?`<optgroup label="Secondo ruolo">${fit2.map(o).join('')}</optgroup>`:''}${other.length?`<optgroup label="Altri">${other.map(o).join('')}</optgroup>`:''}`;
}
function autoForm(m){
  const f=getForm(m), conv=convocati(m), pool=(conv.length?conv:db.athletes.filter(a=>a.iscritto));
  const ref=m.data||'9999-12-31', pres=a=>{ const st=absStats(a.id, ref); return st.n-st.ass; };
  const order=['P','O','C1','C2','B1','B2'];   // prima i ruoli con meno scelta
  let best=null;
  for(const first of ['F','M']){
    const sexFor=slot=>{ const i=ORDER.indexOf(slot); return i%2===0?first:(first==='F'?'M':'F'); };
    const used=new Set(), res={}; let score=0, miss=0, second=[];
    for(const slot of order){
      const want=SLOT_ROLE[slot], sx=sexFor(slot);
      const c=pool.filter(a=>!used.has(a.id) && sexOf(a)===sx).map(a=>({a, fit:roleKey(a.ruolo)===want?2:roleKey(a.ruolo2)===want?1:0, p:pres(a)}))
        .sort((x,y)=>(y.fit-x.fit)||(y.p-x.p))[0];
      if(c){ res[slot]=c.a.id; used.add(c.a.id); score+=c.fit*10+c.p; if(c.fit===1) second.push(athShort(c.a.id)+' come '+SLOTS.find(x=>x[0]===slot)[1].replace(/ \d$/,'')); if(!c.fit) miss++; }
      else { res[slot]=''; miss+=2; }
    }
    score-=miss*25;
    if(!best || score>best.score) best={res, score, second, miss};
  }
  Object.assign(f, best.res); m.formazione=f; touchMatch(m);
  $('#form-panel').innerHTML=formPanelHTML(m);
  toast(best.miss ? 'Formazione proposta: controlla i posti segnalati' : 'Formazione proposta'+(best.second.length?' · '+best.second.join(', '):''));
}
function formWarn(m,f){
  const w=[], ids=SLOTS.map(([s])=>f[s]).concat(f.libero?[f.L]:[]).filter(Boolean), conv=new Set(m.convocati||[]);
  if(new Set(ids).size<ids.length) w.push('la stessa persona è in due posti');
  if(conv.size && ids.some(id=>!conv.has(id))) w.push('c\'è chi non è tra i convocati');
  const miss=SLOTS.filter(([s])=>!f[s]).map(([,l])=>l); if(miss.length) w.push('manca: '+miss.join(', '));
  if(!miss.length){ const sx=ORDER.map(s=>{ const a=getAt(f[s]); return a?sexOf(a):''; });
    if(sx.some(x=>!x)) w.push('a qualcuno manca il sesso in anagrafica');
    else if(!sx.every((x,i)=>x!==sx[(i+1)%6])) w.push('in campo uomini e donne devono essere alternati (3 e 3): nell\'ordine Palleggiatore, Banda 1, Centrale 1, Opposto, Banda 2, Centrale 2 si alternano uomo e donna'); }
  return w;
}
function formPanelHTML(m){
  const f=getForm(m), w=formWarn(m,f), st=m.stats&&m.stats.ev&&m.stats.ev.length;
  return `<h2>Formazione 5-1 e rotazioni</h2>
    <div class="fslots">${SLOTS.map(([s,l])=>`<label class="fslot"><span><i style="background:${ROLE_COL[SLOT_ROLE[s]]}"></i>${l}</span><select data-fs="${s}">${formOptions(m,f,s)}</select></label>`).join('')}</div>
    <div class="actions" style="margin-top:12px;gap:8px 16px">
      <label class="sw" style="min-height:0"><input type="checkbox" data-fs="libero" ${f.libero?'checked':''}> Usiamo il libero</label>

      <label class="fslot" style="flex-direction:row;align-items:center;gap:8px">Si parte in<select data-fs="start" style="width:auto">${ROTNAME.map((n,i)=>`<option value="${i}" ${+f.start===i?'selected':''}>${n} (palleggiatore in zona ${n.slice(1)})</option>`).join('')}</select></label>
    </div>
    ${w.length?`<div class="cwarn" style="margin-top:8px">⚠ ${w.join(' · ')}</div>`:''}
    <div class="actions" style="margin-top:12px"><button class="btn" data-action="form-auto">✨ Proponi formazione</button><button class="btn" data-action="rot-view" ${formOk(f)?'':'disabled'}>Vedi le 6 rotazioni</button><button class="btn" data-action="rot-print" ${formOk(f)?'':'disabled'}>Stampa per la panchina</button>
      <button class="btn primary" data-action="live-open">📊 ${st?'Riprendi le statistiche':'Statistiche in partita'}</button>${st?`<button class="btn" data-action="stats-match">Riepilogo statistiche</button>`:''}</div>`;
}
function rotCardsHTML(m, f){
  return ROTNAME.map((n,i)=>{ const k=(+f.start+i)%6, z=rotAt(k), server=f[z[0]];
    return `<div class="rotcard"><h3>Rotazione ${i+1} · ${ROTNAME[k]} <span class="muted" style="font-weight:600;font-size:12.5px">· batte ${esc(athShort(server))}</span></h3>
      <div class="rotpair"><div><div class="lbl">Partenza (ricezione)</div>${courtSVG(f,k,'partenza',{serve:false})}</div><div><div class="lbl">In gioco</div>${courtSVG(f,k,'gioco')}</div></div></div>`; }).join('');
}

const ACTS={

  ric:{l:'Ricezione', b:[['#','Perfetta','g'],['+','Positiva','g'],['-','Negativa','y'],['=','Errore','r']]},
  att:{l:'Attacco', b:[['#','Punto','g'],['+','In gioco','y'],['=','Errore / murato','r']]},
  mur:{l:'Muro', b:[['#','Punto','g'],['+','Toccata','y']]},
  dif:{l:'Difesa', b:[['+','Difesa','g'],['=','Errore','r']]},
  err:{l:'Altri errori', b:[['=','Fallo / invasione','r']]}

const ASYM=(k,v,c)=>k==='ric'&&v==='#'?'++':c==='g'?'+':c==='y'?'0':'−';
const OUR_PT=e=>e.v==='#' && ['bat','att','mur'].includes(e.k) || e.k==='pt';
const THEIR_PT=e=>e.v==='=' && ['bat','ric','att','dif','err'].includes(e.k) || e.k==='pl';
function getStats(m){ if(!m.stats) m.stats={sets:[], ev:[], live:null}; const S=m.stats; S.sets=S.sets||[]; S.ev=S.ev||[];
  if(!S.live){ const f=getForm(m); S.live={set:1, noi:0, loro:0, servo:false, k:+f.start||0, subs:{}, played:{}}; }
  S.live.subs=S.live.subs||{}; S.live.played=S.live.played||{}; return S; }
function liveWho(m){ const f=getForm(m), L=getStats(m).live; return slot=>(L.subs[slot]!==undefined?L.subs[slot]:f[slot]); }
function onCourt(m){ const who=liveWho(m), f=getForm(m), L=getStats(m).live, z=rotAt(L.k);
  const ids=z.map(s=>who(s)); if(f.libero && f.L) ids.push(f.L); return ids.filter(Boolean); }
function markPlayed(m){ const L=getStats(m).live; const s=new Set(L.played[L.set]||[]); onCourt(m).forEach(id=>s.add(id)); L.played[L.set]=[...s]; }

function evLabel(e){ if(e.k==='pt') return 'punto nostro'; if(e.k==='pl') return 'punto loro'; const A=ACTS[e.k]; const b=A&&A.b.find(x=>x[0]===e.v); return A?A.l+': '+(b?b[1].toLowerCase():e.v):e.k; }
function liveEvent(k, v){
  const m=getMatch(ui.matchId), S=getStats(m), L=S.live;
  if(k!=='pt' && k!=='pl' && !ui.livePick){ toast('Tocca prima il giocatore'); return; }
  const e={id:newId('ev'), t:Date.now(), s:L.set, a:(k==='pt'||k==='pl')?'':ui.livePick, k, v:v||'', prev:{noi:L.noi, loro:L.loro, servo:L.servo, k:L.k}};

  else if(THEIR_PT(e)){ L.loro++; L.servo=false; }
  e.noi=L.noi; e.loro=L.loro;
  S.ev.push(e); markPlayed(m);

function statTable(evs, played, ids){
  const P={}; const g=id=>P[id]||(P[id]={bat:0,ace:0,batE:0,ric:0,ricP:0,ricG:0,ricE:0,att:0,attP:0,attE:0,mur:0,dif:0,err:0,set:0});
  for(const e of evs){ if(!e.a) continue; const p=g(e.a);
    if(e.k==='bat'){ p.bat++; if(e.v==='#') p.ace++; if(e.v==='=') p.batE++; }
    if(e.k==='ric'){ p.ric++; if(e.v==='#') p.ricP++; if(e.v==='#'||e.v==='+') p.ricG++; if(e.v==='=') p.ricE++; }
    if(e.k==='att'){ p.att++; if(e.v==='#') p.attP++; if(e.v==='=') p.attE++; }
    if(e.k==='mur' && e.v==='#') p.mur++;
    if(e.k==='dif' && e.v==='+') p.dif++;
    if(e.k==='err' || (e.k==='dif' && e.v==='=')) p.err++;
  }
  for(const [id,n] of Object.entries(played||{})) g(id).set=n;
  const pc=(a,b)=>b?Math.round(100*a/b)+'%':'—';
  const rows=Object.entries(P).filter(([id])=>!ids || ids.has(id)).map(([id,p])=>({a:getAt(id), p, pts:p.ace+p.attP+p.mur})).filter(x=>x.a).sort((x,y)=>y.pts-x.pts || fullName(x.a).localeCompare(fullName(y.a),'it'));
  if(!rows.length) return '<div class="muted">Nessuna statistica registrata.</div>';
  return `<div style="overflow:auto"><table class="atable stt"><thead><tr><th>Atleta</th><th class="n" title="Set giocati">Set</th><th class="n">Punti</th><th class="n" title="Battute totali / ace / errori">Battute</th><th class="n" title="Battute sbagliate">Err. batt.</th><th class="n" title="Ricezioni totali">Ricez.</th><th class="n" title="Ricezioni perfette o positive">Ric. +</th><th class="n" title="Ricezioni perfette">Ric. #</th><th class="n" title="Attacchi totali / punti / errori">Attacchi</th><th class="n" title="(punti - errori) / attacchi">Effic. att.</th><th class="n">Muri</th><th class="n">Difese</th><th class="n" title="Falli, invasioni, errori in difesa">Errori</th></tr></thead><tbody>
    ${rows.map(({a,p,pts})=>`<tr><td style="white-space:nowrap">${avatarHTML(a,22)}<b>${esc(fullName(a))}</b></td><td class="n">${p.set||'—'}</td><td class="n"><b>${pts}</b></td><td class="n">${p.bat} / ${p.ace} / ${p.batE}</td><td class="n">${pc(p.batE,p.bat)}</td><td class="n">${p.ric}</td><td class="n">${pc(p.ricG,p.ric)}</td><td class="n">${pc(p.ricP,p.ric)}</td><td class="n">${p.att} / ${p.attP} / ${p.attE}</td><td class="n">${p.att?Math.round(100*(p.attP-p.attE)/p.att)+'%':'—'}</td><td class="n">${p.mur}</td><td class="n">${p.dif}</td><td class="n">${p.err}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">Battute: totali / ace / errori · Ric. +: perfette o positive · Effic. att.: (punti − errori) ÷ attacchi.</p>`;
}

function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getCal(){
  let c={}; try{ c=JSON.parse(db.settings.calendarioAllenamenti||'{}')||{}; }catch(e){ c={}; }
  if(!c.giorni) c.giorni={'3':'','0':''};          // mercoledì e domenica
  if(!c.dal) c.dal=todayISO();
  if(!c.al) c.al='2027-05-31';

function saveCal(c){ db.settings.calendarioAllenamenti=JSON.stringify(c); clearTimeout(saveCal._t); saveCal._t=setTimeout(()=>persist.settings().catch(saveFail),400); }
function trainingsSorted(){ return [...db.trainings].sort((a,b)=>(a.data+(a.ora||'')).localeCompare(b.data+(b.ora||''))); }
function isRecorded(t){ return !t.annullato && Object.keys(t.presenze||{}).length>0; }
/* assenze negli ultimi n allenamenti con presenze segnate, prima della data indicata (esclusa) */
function absStats(aid, beforeISO, n=5){
  const L=trainingsSorted().filter(t=>isRecorded(t) && t.data<beforeISO).slice(-n);
  let ass=0, giu=0;
  const marks=L.map(t=>{ const s=t.presenze[aid]||'A'; if(s!=='P'){ ass++; if(s==='G') giu++; } return s; });
  return {n:L.length, ass, giu, marks};
}
function seasonPct(aid){
  const L=db.trainings.filter(t=>isRecorded(t) && t.data<=todayISO()); if(!L.length) return null;
  return Math.round(100*L.filter(t=>t.presenze[aid]==='P').length/L.length);
}
function absBadge(st){

  const tip=`${st.ass} assenz${st.ass===1?'a':'e'} negli ultimi ${st.n} allenamenti`+(st.giu?` (di cui ${st.giu} giustificat${st.giu===1?'a':'e'})`:'');
  return `<span class="absb ${cls}" title="${esc(tip)}"><span class="dots">${st.marks.map(m=>`<i class="dot d${m}"></i>`).join('')}</span>${st.ass}/${st.n}</span>`;
}
function regAthletes(){ return db.athletes.filter(a=>ui.pAll || a.iscritto).sort((x,y)=>(x.cognome||'').localeCompare(y.cognome||'','it') || (x.nome||'').localeCompare(y.nome||'','it')); }

function touchTr(t){ t.updatedAt=Date.now(); clearTimeout(trTimers[t.id]); trTimers[t.id]=setTimeout(()=>persist.tr(t).catch(saveFail),350); }
function generateTrainings(){
  const c=getCal(), days=Object.keys(c.giorni).map(Number);
  if(!days.length){ alert('Scegli almeno un giorno della settimana.'); return; }
  const d0=parseISO(c.dal), d1=parseISO(c.al);
  if(!d0 || !d1 || d1<d0){ alert('Controlla le date di inizio e di fine.'); return; }
  if((d1-d0)/864e5 > 400){ alert('Il periodo è troppo lungo: al massimo poco più di un anno.'); return; }
  const have=new Set(db.trainings.map(t=>t.data)), mdays=new Set(db.matches.map(m=>m.data).filter(Boolean));
  const items=[]; let skipped=0; const now=Date.now();
  for(let d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
    if(!days.includes(d.getDay())) continue;
    const iso=toISO(d); if(have.has(iso)) continue;
    if(c.saltaPartite && mdays.has(iso)){ skipped++; continue; }
    items.push({id:newId('al'), data:iso, ora:c.giorni[d.getDay()]||'', note:'', annullato:false, presenze:{}, createdAt:now, updatedAt:now});
  }
  if(!items.length){ toast(skipped?`Nessuna data nuova (saltate ${skipped} date con partita)`:'Il calendario è già completo'); return; }
  api('POST','/api/allenamenti-multipli',{items}).then(()=>{ db.trainings.push(...items); render(); toast(`Aggiunti ${items.length} allenamenti`+(skipped?` · saltate ${skipped} date con partita`:'')); }).catch(saveFail);
}

  const i=db.trainings.findIndex(x=>x.id===t.id); if(i>=0) db.trainings[i]=clone(t); else db.trainings.push(clone(t));

function dosOn(d){ return !!(d && d.misura==='serie'); }
function dosShort(d){ if(!dosOn(d)) return ''; return `${d.serie||1} × ${d.ripetizioni||0}${d.unita==='sec'?'″':''}${d.perLato?' per lato':''}`; }
function dosFull(d){ if(!dosOn(d)) return '';
  return [`${d.serie||1} serie × ${d.ripetizioni||0} ${d.unita==='sec'?'secondi':'ripetizioni'}${d.perLato?' per lato':''}`, d.recupero?`recupero ${d.recupero}″`:'', d.carico||''].filter(Boolean).join(' · '); }
function estimateMin(d){
  if(!dosOn(d)) return null;
  const rep = d.unita==='sec' ? (d.ripetizioni||0) : (d.ripetizioni||0)*3;      // circa 3 secondi a ripetizione
  const work = rep*(d.perLato?2:1), n=Math.max(1,d.serie||1);
  return Math.max(1, Math.ceil((n*work + (n-1)*(d.recupero||0))/60));
}

    <div id="dos-box" class="grid g-dos ${on?'':'hidden'}">

function readDos(){
  const f=$('#ex-form-edit'), v=n=>f.querySelector(`[name=${n}]`), int=(n,min)=>Math.max(min, parseInt(v(n).value,10)||0);
  return {misura:'serie', serie:int('serie',1), ripetizioni:int('ripetizioni',0), unita:v('unita').value, perLato:v('perLato').checked, recupero:int('recupero',0), carico:v('carico').value.trim()};
}
function updateDosUI(init){
  const f=$('#ex-form-edit'); if(!f || !$('#dos-panel')) return;
  const on=f.querySelector('[name=misura]:checked')?.value==='serie';
  $('#dos-box').classList.toggle('hidden', !on);
  if(!on){ $('#dos-sum').textContent=''; return; }
  const d=readDos(), est=estimateMin(d);
  if(!init) f.querySelector('[name=durata]').value=est;
  $('#dos-sum').innerHTML=`<b>${esc(dosFull(d))}</b> · durata stimata ≈ ${est} min, già inserita nel campo «Durata» (puoi correggerla)`;
}
function dosEditorHTML(it){
  const d=effDos(it); if(!dosOn(d)) return '';
  const inp=(k,min,max)=>`<input type="number" min="${min}" max="${max}" data-idos="${k}" data-uid="${it.uid}" value="${esc(d[k]??'')}">`;
  return `<div class="idos">Serie ${inp('serie',1,20)} × ${inp('ripetizioni',1,600)} ${d.unita==='sec'?'sec':'rip.'}${d.perLato?' per lato':''} · rec. ${inp('recupero',0,600)}″${d.carico?' · '+esc(d.carico):''}
    ${it.dosaggio?`<button class="iconbtn" data-action="it-dos-reset" data-uid="${it.uid}" title="Torna ai valori della scheda">↺</button><span class="muted">personalizzato per questa sessione</span>`:''}</div>`;
}
function distSelectHTML(){
  const ds=[...new Set(db.exercises.map(e=>e.distretto).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
  if(!ds.length) return '';
  return `<select id="ex-dist"><option value="">Tutti i distretti</option>${ds.map(x=>`<option ${ui.f.dist===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
}

document.addEventListener('click', e=>{
  if(ui.view!=='live') return;
  const pk=e.target.closest('[data-pick]'); if(pk){ ui.livePick = ui.livePick===pk.dataset.pick ? null : pk.dataset.pick; rerenderLive(); return; }
  const ev=e.target.closest('[data-ev]'); if(ev) liveEvent(ev.dataset.ev, ev.dataset.v);
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='ex-q'){ ui.f.q=t.value; refreshExList(); return; }
  if(t.id==='at-q'){ ui.af.q=t.value; $('#at-rows').innerHTML=atRows(); return; }
  if(t.dataset.mf==='competizione' && t.value==='__new'){ const m=getMatch(ui.matchId); if(!m) return; const v=(prompt('Nome del nuovo campionato (es. Primaverile 2027):')||'').trim();
    if(v && v!==CAMP_NONE){ if(!campList().some(c=>c.name===v)) saveCampDefs([...campDefs(), v]); m.competizione=v; touchMatch(m); refreshMatch(m); }
    t.innerHTML=campOptionsHTML(m); return; }
  if(t.dataset.mf){ const m=getMatch(ui.matchId); if(!m) return; m[t.dataset.mf] = t.dataset.mf==='inCasa' ? t.value==='1' : t.value; touchMatch(m); refreshMatch(m, t.dataset.mf); return; }
  if(t.closest('#at-form')){ if(t.name==='dataNascita') refreshAtDerived(); return; }
  if(t.id==='pick-q'){ ui.pick.q=t.value; $('#plist').innerHTML=pickListHTML(getSess(ui.sessId)); return; }
  if(t.closest('#dos-panel')) updateDosUI();
  if(t.closest('#ex-form-edit') && !t.closest('.sed')){ markDirty(); return; }
  if(t.dataset.sf){ const s=getSess(ui.sessId); s[t.dataset.sf]=t.value; touchSess(s, t.dataset.sf==='oraInizio'?'times':null); if(t.dataset.sf==='titolo') $('.page-head h1').textContent=t.value||'Nuova sessione'; return; }
  if(t.dataset.idos){ const s=getSess(ui.sessId), it=s&&s.items.find(i=>i.uid===t.dataset.uid); if(!it) return;
    const d=Object.assign({}, effDos(it)); d[t.dataset.idos]=Math.max(t.dataset.idos==='recupero'?0:1, parseInt(t.value,10)||0);
    it.dosaggio=d; it.durata=estimateMin(d); const di=$(`[data-if=durata][data-uid="${it.uid}"]`); if(di) di.value=it.durata;
    touchSess(s,'times'); return; }
  if(t.dataset.if){ const s=getSess(ui.sessId), it=s.items.find(i=>i.uid===t.dataset.uid); if(!it) return;
    it[t.dataset.if] = t.dataset.if==='durata' ? (t.value===''?0:Math.max(0,Math.round(+t.value)||0)) : t.value;
    touchSess(s, t.dataset.if==='durata'?'times':null); autoGrow(t); return; }
  if(t.dataset.set){ db.settings[t.dataset.set]=t.value; if(t.dataset.set==='colore'||t.dataset.set==='accento') applyBrand(); clearTimeout(window._setT); window._setT=setTimeout(()=>{ persist.settings().then(()=>{ const i=$('#set-saved'); if(i){ i.textContent='✓ Salvato'; setTimeout(()=>i.textContent='',1500);} }).catch(saveFail); },400); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='ex-form'){ ui.f.form=t.value; refreshExList(); }
  if(t.id==='ex-dist'){ ui.f.dist=t.value; refreshExList(); }
  if(t.id==='at-ruolo'){ ui.af.ruolo=t.value; $('#at-rows').innerHTML=atRows(); }
  if(t.id==='at-iscr'){ ui.af.iscr=t.value; $('#at-rows').innerHTML=atRows(); }
  if(t.closest('#at-form') && t.name==='dataNascita') refreshAtDerived();
  if(t.dataset.conv){ const m=getMatch(ui.matchId); if(!m) return;
    if(t.checked){ const a0=getAt(t.dataset.conv); if(a0 && !visitaOk(a0,m) && !confirm(`${fullName(a0)}: ${visitaWhy(a0)}. Convocarlo comunque?`)){ t.checked=false; return; } } const s=new Set(m.convocati||[]); if(t.checked) s.add(t.dataset.conv); else s.delete(t.dataset.conv);
    m.convocati=db.athletes.filter(a=>s.has(a.id)).map(a=>a.id); touchMatch(m); refreshMatch(m,'conv'); return; }
  if(t.dataset.fs){ const m=getMatch(ui.matchId); if(!m) return; const f=getForm(m); const k=t.dataset.fs;
    f[k]= k==='libero' ? t.checked : k==='start' ? +t.value : t.value; m.formazione=f; touchMatch(m); $('#form-panel').innerHTML=formPanelHTML(m); return; }
  if(t.dataset.live==='k'){ const m=getMatch(ui.matchId), L=getStats(m).live; L.k=+t.value; markPlayed(m); touchMatch(m); rerenderLive(); return; }
  if(t.id==='cs-all'){ ui.csAll=t.checked; ui.csOpen=true; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==='p-all'){ ui.pAll=t.checked; $('#reg').innerHTML=regTable(); return; }
  if(t.dataset.calday!==undefined){ const c=getCal(); if(t.checked) c.giorni[t.dataset.calday]=c.giorni[t.dataset.calday]||''; else delete c.giorni[t.dataset.calday]; saveCal(c);
    const box=t.closest('.dayopt'); box.classList.toggle('on',t.checked); box.querySelector('input[type=time]').disabled=!t.checked; return; }
  if(t.dataset.caltime!==undefined){ const c=getCal(); if(c.giorni[t.dataset.caltime]!==undefined){ c.giorni[t.dataset.caltime]=t.value; saveCal(c); } return; }
  if(t.dataset.cal){ const c=getCal(); c[t.dataset.cal]= t.type==='checkbox' ? t.checked : t.value; saveCal(c); return; }
  if(t.dataset.iscr){ const a=getAt(t.dataset.iscr); if(!a) return; a.iscritto=t.checked; a.updatedAt=Date.now();
    persist.ath(a).then(()=>{ render(); toast(a.iscritto?'Segnato come iscritto':'Segnato come non iscritto'); })
      .catch(err=>{ a.iscritto=!t.checked; t.checked=a.iscritto; saveFail(err); }); }
  if(t.dataset.po){ ui.printOpts[t.dataset.po]=t.checked; }
  if(t.closest('#ex-form-edit') && !t.closest('.sed')) markDirty();
});
function autoGrow(t){ if(t.tagName!=='TEXTAREA') return; t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }

/* trascinamento delle voci nel programma */
let dragUid=null;
document.addEventListener('mousedown', e=>{ const h=e.target.closest('.handle'); const it=h&&h.closest('.item'); if(it) it.draggable=true; });
document.addEventListener('mouseup', ()=>{ $$('.item[draggable=true]').forEach(x=>{ if(!dragUid) x.draggable=false; }); });
document.addEventListener('dragstart', e=>{ const it=e.target.closest?.('.item[data-uid]'); if(!it) return; dragUid=it.dataset.uid; it.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragUid); }catch(_){} });
document.addEventListener('dragover', e=>{ if(!dragUid) return; const it=e.target.closest('.item[data-uid]'); $$('.item').forEach(x=>x.classList.remove('drop-before','drop-after')); if(!it||it.dataset.uid===dragUid) return; e.preventDefault(); const r=it.getBoundingClientRect(); it.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after'); });
document.addEventListener('drop', e=>{
  if(!dragUid) return; const it=e.target.closest('.item[data-uid]'); if(!it) return; e.preventDefault();
  const s=getSess(ui.sessId); const r=it.getBoundingClientRect(); const after=e.clientY>=r.top+r.height/2;
  const from=s.items.findIndex(x=>x.uid===dragUid); const [m]=s.items.splice(from,1);
  let to=s.items.findIndex(x=>x.uid===it.dataset.uid); if(after) to++;
  s.items.splice(to,0,m); dragUid=null; touchSess(s,'items');
});
document.addEventListener('dragend', ()=>{ dragUid=null; $$('.item').forEach(x=>{ x.classList.remove('dragging','drop-before','drop-after'); x.draggable=false; }); });

$('#app').innerHTML='<div class="empty">Caricamento di Volleysched…</div>';
(async ()=>{
  try{
    await Store.init();
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    Store.onChange(kind=>{ if(kind==='remote') refreshFromRemote(); });
    Sync.onStatus(renderSyncPill);
    await Sync.init();
    await loadState();
    if(Store.isEmpty() && !Sync.config() && !Store.getMeta('avviato')) ui.view='benvenuto';
    render();
  }catch(e){
    console.error(e);
    $('#app').innerHTML=`<div class="empty" style="text-align:left;max-width:640px;margin:40px auto"><h2 style="margin-bottom:8px">Volleysched non si è aperto</h2>
    <p>Il browser non permette di usare l'archivio dei dati. Succede, per esempio, nelle finestre di navigazione in incognito. Apri l'app in una finestra normale.</p>
    <p class="muted" style="font-size:13px">Dettaglio: ${esc(e.message||e)}</p></div>`;
  }
})();
let lastPhone=isPhone();
window.addEventListener('resize', ()=>{ const p=isPhone(); if(p!==lastPhone){ lastPhone=p; if(ui.view==='atleti') render(); } });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushPending(); });

/* app installabile: funzionamento senza rete e aggiornamenti */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer=w=>{
      if(document.querySelector('.update-bar')) return;
      const bar=document.createElement('div'); bar.className='update-bar';
      bar.innerHTML='È disponibile una nuova versione dell\'app <button class="btn sm primary">Aggiorna</button>';
      bar.querySelector('button').onclick=()=>{ if(ui.dirty && !confirm('Ci sono modifiche non salvate. Aggiornare lo stesso?')) return; flushPending(); w.postMessage('skipWaiting'); };
      document.body.appendChild(bar);
    };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', ()=>{ const w=reg.installing; w && w.addEventListener('statechange', ()=>{ if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(e=>console.warn('Service worker non registrato', e));
  let reloaded=false; const hadController=!!navigator.serviceWorker.controller;   // al primo avvio non serve ricaricare
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(reloaded || !hadController) return; reloaded=true; location.reload(); });
}
</script>
